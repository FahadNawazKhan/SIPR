services:
  - type: web
    name: sipr-backend
    env: node
    rootDir: server
    buildCommand: pnpm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
